<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2f6fed">
  <title>대양고등학교 입학홍보 플랫폼</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">

    <!-- 최초 1회 사용자 선택 -->
    <section id="userSelectScreen" class="screen user-select-screen">
      <div class="brand-mark"><img src="img/logo.png" alt="대양고등학교 로고"></div>
      <p class="eyebrow">대양고등학교 입학홍보 플랫폼</p>
      <h1>반갑습니다!</h1>
      <p class="select-guide">해당하는 항목을 선택해주세요.</p>

      <div class="user-select-list">
        <button class="user-type-btn" data-user="student">
          <span class="user-icon">🎒</span>
          <span>중학생</span>
        </button>
        <button class="user-type-btn" data-user="parent">
          <span class="user-icon">👨‍👩‍👧</span>
          <span>학부모</span>
        </button>
        <button class="user-type-btn" data-user="teacher">
          <span class="user-icon">👨‍🏫</span>
          <span>중학교 교사</span>
        </button>
      </div>
    </section>

    <!-- 메인 -->
    <main id="mainApp" class="screen main-app is-hidden">
      <header class="top-header">
        <div>
          <p class="welcome-label">WELCOME</p>
          <h1 id="welcomeMessage">예비 대양고 학생님, 반갑습니다!</h1>
          <p class="school-name">대양고등학교 입학홍보 플랫폼</p>
        </div>

        <button id="changeUserBtn" class="change-user-btn" type="button">
          <span aria-hidden="true">👤</span>
          <span>사용자 변경</span>
        </button>
      </header>

      <!-- 통합 검색 -->
      <section class="search-wrap">
        <label class="search-box">
          <span class="search-icon">⌕</span>
          <input id="searchInput" type="search" placeholder="무엇이 궁금하신가요?" autocomplete="off">
        </label>
        <div id="searchResults" class="search-results is-hidden"></div>
      </section>

      <!-- 배너 -->
      <section class="banner-section">
        <div class="banner-slider">
          <article id="slide1" class="banner-slide active">
            <div class="banner-image-slot">
              <img src="img/daeyang.png" alt="대양고등학교 전경">
            </div>
            <div class="banner-copy">
              <span>DAEYANG HIGH SCHOOL</span>
              <strong>미래를 준비하는 즐거운 학교</strong>
            </div>
          </article>

          <article id="slide2" class="banner-slide">
            <div class="banner-image-slot">
              <img src="img/soccer.png" alt="대양고등학교 학교생활">
            </div>
            <div class="banner-copy">
              <span>CAMPUS LIFE</span>
              <strong>직접 보고, 배우고, 경험하는 학교생활</strong>
            </div>
          </article>

          <article id="slide3" class="banner-slide">
            <div class="banner-image-slot">
              <img src="img/esports.png" alt="대양고등학교 e스포츠">
            </div>
            <div class="banner-copy">
              <span>NEW POSSIBILITIES</span>
              <strong>대양고에서 새로운 가능성을 만나보세요</strong>
            </div>
          </article>
        </div>

        <div class="banner-dots">
          <button class="dot active" data-slide="0" aria-label="첫 번째 배너"></button>
          <button class="dot" data-slide="1" aria-label="두 번째 배너"></button>
          <button class="dot" data-slide="2" aria-label="세 번째 배너"></button>
        </div>
      </section>

      <!-- 바로가기 -->
      <section class="menu-section">
        <p class="eyebrow">QUICK MENU</p>
        <h2>대양고 바로가기</h2>

        <div class="menu-grid">
          <button class="menu-card" data-action="video">
            <div class="menu-illustration"><img src="img/Video.png" alt=""></div>
            <span class="menu-title">학교 홍보영상</span>
            <span class="menu-sub">5분 영상 바로보기</span>
          </button>

          <button class="menu-card" data-action="homepage">
            <div class="menu-illustration"><img src="img/School.png" alt=""></div>
            <span class="menu-title">학교 홈페이지</span>
            <span class="menu-sub">공식 홈페이지</span>
          </button>

          <button class="menu-card" data-action="department">
            <div class="menu-illustration"><img src="img/Department.png" alt=""></div>
            <span class="menu-title">학과 소개</span>
            <span class="menu-sub">학과 바로가기</span>
          </button>

          <button class="menu-card" data-action="news">
            <div class="menu-illustration"><img src="img/Notice.png" alt=""></div>
            <span class="menu-title">학교소식</span>
            <span class="menu-sub">인스타 · 유튜브</span>
          </button>

          <button class="menu-card" data-action="schedule">
            <div class="menu-illustration"><img src="img/Calendar.png" alt=""></div>
            <span class="menu-title">학사일정</span>
            <span class="menu-sub">학교 일정 확인</span>
          </button>

          <button class="menu-card" data-action="events">
            <div class="menu-illustration"><img src="img/Event.png" alt=""></div>
            <span class="menu-title">행사 안내</span>
            <span class="menu-sub">진행 중인 행사</span>
          </button>
        </div>
      </section>

      <!-- 하단 고정 메뉴 -->
      <nav class="bottom-nav">
        <button class="nav-btn active" data-nav="home"><span>⌂</span><small>홈</small></button>
        <button class="nav-btn" data-nav="faq"><span>?</span><small>FAQ</small></button>
        <button class="nav-btn" data-nav="contact"><span>☎</span><small>문의</small></button>
      </nav>
    </main>
  </div>

  <!-- 학교소식 선택창 -->
  <div id="socialModal" class="modal-backdrop is-hidden">
    <div class="modal-card">
      <button id="closeSocialModal" class="modal-close" type="button" aria-label="닫기">×</button>
      <p class="eyebrow">SCHOOL NEWS</p>
      <h2>대양고의 소식을 만나보세요!</h2>
      <div class="modal-actions">
        <button id="instagramBtn" class="action-btn">📸 공식 인스타그램</button>
        <button id="youtubeChannelBtn" class="action-btn">▶ 공식 유튜브</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
